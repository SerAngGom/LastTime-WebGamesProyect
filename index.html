<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris UJI (minimal)</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="wrap">
    <div id="hud-container">
      <div id="playerName">
        <span id="nameValue">PlayerName</span>
      </div>
      <div id="score">
        Score: 0
      </div>
      <div id="bonus">
        Bonus Multiplier: x1
      </div>
      <div id="lines">
        Total lines: 0
      </div>
      <div id="timer">
        Time: 0s</div>
    </div>
    <div>
      <div id="game"></div>
    </div>
    <div class="panel-right">
      <h3>Siguiente:</h3>
      <canvas id="previewCanvas", width="300", height="300" style="border: 1px solid #333"></canvas>
    </div>
  </div>
  <script src="js/lib/phaser.js"></script>
  <script src="js/hof.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
